<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="800" height="920" role="img" aria-label="김재현과 정하은 웨딩 스냅 샘플 이미지">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE7DC" />
      <stop offset="48%" stop-color="#E2DACB" />
      <stop offset="100%" stop-color="#D2C8B6" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="62%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#F6EFE2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D9CEBC" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="archShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9BFA9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A69C88" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4940" />
      <stop offset="100%" stop-color="#35342D" />
    </linearGradient>
    <linearGradient id="gownGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F3" />
      <stop offset="55%" stop-color="#F1EAE0" />
      <stop offset="100%" stop-color="#DFD5C5" />
    </linearGradient>
    <linearGradient id="veilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#F5EFE6" stop-opacity="0.18" />
    </linearGradient>
    <filter id="filmGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.28  0 0 0 0.065 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="gentleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3E3C32" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Warm Film Backdrop -->
  <rect width="800" height="920" fill="url(#bgSky)" />
  <rect width="800" height="920" fill="url(#sunGlow)" />

  <!-- Architectural Stone Archway -->
  <path d="M 90 920 L 90 320 C 90 135, 225 65, 400 65 C 575 65, 710 135, 710 320 L 710 920 L 650 920 L 650 330 C 650 185, 540 120, 400 120 C 260 120, 150 185, 150 330 L 150 920 Z" fill="url(#archShade)" />
  <line x1="150" y1="330" x2="150" y2="920" stroke="#BFB5A2" stroke-width="1.5" opacity="0.55" />
  <line x1="650" y1="330" x2="650" y2="920" stroke="#BFB5A2" stroke-width="1.5" opacity="0.55" />

  <!-- Soft Sunlight Window Diagonal Shafts -->
  <polygon points="560,0 800,0 800,480 280,920 120,920" fill="#FFFDF8" opacity="0.22" filter="url(#softBlur)" />
  <polygon points="440,0 520,0 160,640 80,580" fill="#FFFDF8" opacity="0.14" filter="url(#softBlur)" />

  <!-- Subtle Olive Botanical Branches Framing Top Corners -->
  <g opacity="0.55" fill="#6F7458">
    <path d="M 55 185 Q 115 210 165 265" fill="none" stroke="#6F7458" stroke-width="2" />
    <ellipse cx="92" cy="195" rx="16" ry="6" transform="rotate(-25 92 195)" />
    <ellipse cx="122" cy="212" rx="18" ry="6.5" transform="rotate(20 122 212)" />
    <ellipse cx="145" cy="238" rx="15" ry="5.5" transform="rotate(-18 145 238)" />
    <ellipse cx="110" cy="232" rx="14" ry="5" transform="rotate(42 110 232)" />
    <ellipse cx="75" cy="210" rx="13" ry="5" transform="rotate(30 75 210)" />
  </g>
  <g opacity="0.48" fill="#7D8166">
    <path d="M 745 140 Q 675 170 620 235" fill="none" stroke="#7D8166" stroke-width="2" />
    <ellipse cx="705" cy="154" rx="17" ry="6" transform="rotate(22 705 154)" />
    <ellipse cx="672" cy="176" rx="16" ry="5.5" transform="rotate(-24 672 176)" />
    <ellipse cx="645" cy="205" rx="15" ry="5" transform="rotate(18 645 205)" />
    <ellipse cx="688" cy="198" rx="13" ry="4.5" transform="rotate(-40 688 198)" />
  </g>

  <!-- Soft Ground Shadow -->
  <ellipse cx="400" cy="875" rx="195" ry="22" fill="#8C8371" opacity="0.22" filter="url(#softBlur)" />

  <!-- Groom Silhouette (Left, gently leaning toward Bride) -->
  <g filter="url(#gentleShadow)">
    <!-- Groom Hair & Head -->
    <circle cx="332" cy="312" r="34" fill="#E3C7B0" />
    <path d="M 297 308 C 296 276, 322 266, 344 270 C 364 274, 371 294, 366 312 C 362 296, 348 289, 327 291 C 312 293, 303 302, 297 308 Z" fill="#3B3932" />
    <!-- Neck & White Collar -->
    <rect x="322" y="340" width="22" height="26" rx="8" fill="#DEC0A7" />
    <polygon points="315,362 334,394 352,362" fill="#FAF7F2" />
    <!-- Bowtie -->
    <polygon points="323,367 333,372 323,377" fill="#36352E" />
    <polygon points="343,367 333,372 343,377" fill="#36352E" />
    <circle cx="333" cy="372" r="3" fill="#2A2923" />
    <!-- Groom Suit Jacket & Trousers -->
    <path d="M 268 415 C 272 378, 300 362, 333 362 C 368 362, 392 380, 398 415 L 408 625 L 398 872 L 348 872 L 336 655 L 318 872 L 268 872 L 264 625 Z" fill="url(#suitGrad)" />
    <!-- Suit Lapels -->
    <polygon points="314,363 333,435 305,425" fill="#5A584D" opacity="0.55" />
    <polygon points="352,363 333,435 361,425" fill="#5A584D" opacity="0.55" />
    <!-- Boutonniere -->
    <circle cx="364" cy="418" r="5" fill="#F6F1E7" />
    <ellipse cx="369" cy="424" rx="4" ry="8" transform="rotate(-25 369 424)" fill="#707558" />
    <!-- Groom Arm embracing -->
    <path d="M 268 415 C 254 475, 258 540, 294 574 L 315 558 C 290 526, 290 480, 298 430 Z" fill="#3F3E36" />
  </g>

  <!-- Bride Figure (Right, leaning slightly with flowing ivory gown & veil) -->
  <g filter="url(#gentleShadow)">
    <!-- Translucent Cathedral Veil Back -->
    <path d="M 465 305 C 525 335, 585 470, 610 690 C 570 725, 505 735, 465 710 Z" fill="url(#veilGrad)" />

    <!-- Bride Head & Soft Low Chignon -->
    <circle cx="445" cy="330" r="31" fill="#E9D0BC" />
    <circle cx="477" cy="342" r="14" fill="#3D3A33" />
    <path d="M 414 328 C 414 298, 440 288, 462 296 C 479 302, 483 324, 476 340 C 468 322, 450 312, 430 316 C 420 318, 416 324, 414 328 Z" fill="#3D3A33" />
    <!-- Delicate Pearl Hairpin -->
    <circle cx="468" cy="332" r="2.5" fill="#FFFDF9" />
    <circle cx="473" cy="337" r="2" fill="#FFFDF9" />

    <!-- Bride Neck & Shoulders -->
    <rect x="434" y="356" width="19" height="24" rx="8" fill="#E4C9B3" />

    <!-- Bride Gown Skirt & Bodice -->
    <path d="M 402 414 C 414 385, 434 378, 450 380 C 474 382, 492 396, 502 426 L 496 508 C 538 615, 578 752, 594 878 C 510 892, 396 892, 326 876 C 350 754, 382 622, 404 510 Z" fill="url(#gownGrad)" />

    <!-- Soft Gown Pleats & Drapes -->
    <path d="M 448 518 Q 465 690 486 882" fill="none" stroke="#DDD2C1" stroke-width="2" opacity="0.65" />
    <path d="M 426 520 Q 412 695 392 880" fill="none" stroke="#DDD2C1" stroke-width="2" opacity="0.55" />
    <path d="M 472 515 Q 515 690 546 878" fill="none" stroke="#D7CBB8" stroke-width="1.8" opacity="0.5" />

    <!-- Veil Front Soft Edge -->
    <path d="M 465 305 C 512 342, 545 452, 542 585" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.65" />

    <!-- Bride Arm holding Bouquet -->
    <path d="M 490 426 C 495 470, 472 505, 428 515 L 418 498 C 452 488, 466 462, 462 424 Z" fill="#E8CEB9" />
  </g>

  <!-- White & Olive Bridal Bouquet -->
  <g transform="translate(402, 504)">
    <ellipse cx="-18" cy="8" rx="14" ry="6" transform="rotate(-30 -18 8)" fill="#6E7559" opacity="0.85" />
    <ellipse cx="20" cy="10" rx="15" ry="6" transform="rotate(28 20 10)" fill="#6E7559" opacity="0.85" />
    <ellipse cx="4" cy="22" rx="13" ry="5.5" transform="rotate(65 4 22)" fill="#7E8568" opacity="0.8" />
    <circle cx="-10" cy="-4" r="12" fill="#FFFDF9" />
    <circle cx="8" cy="-8" r="13" fill="#FAF5EC" />
    <circle cx="0" cy="6" r="14" fill="#FFFFFF" />
    <circle cx="15" cy="4" r="10" fill="#F5EDE3" />
    <circle cx="-16" cy="6" r="9" fill="#F8F3EB" />
    <!-- Blush Pink Ribbon Streamer from Bouquet -->
    <path d="M -2 18 Q -8 46 -18 68" fill="none" stroke="#E8C7C2" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 4 18 Q 10 48 6 72" fill="none" stroke="#F0D4CF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Subtle Photographic Vignette & Film Grain -->
  <rect width="800" height="920" fill="none" stroke="#C5BAA6" stroke-width="16" opacity="0.12" />
  <rect width="800" height="920" fill="#8D826E" filter="url(#filmGrain)" opacity="0.85" />
</svg>
